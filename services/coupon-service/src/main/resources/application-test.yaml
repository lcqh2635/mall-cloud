# application.yml - 主应用配置文件
# 说明：包含应用的基础配置和 Nacos 连接信息
# 注意：Spring Boot 3 + Spring Cloud 2024 使用 spring.config.import 方式

# 应用基本信息
spring:
  application:
    name: user-service

  # Nacos 配置中心配置（基础连接信息）
  cloud:
    # 负载均衡配置
    loadbalancer:
      nacos:
        enabled: true
    nacos:
      # Nacos 服务器地址
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      # 用户名和密码（如果 Nacos 启用了认证）
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}

      # 配置中心特定配置
      config:
        # 是否启用配置中心
        enabled: true
        # 配置中心文件配置是否支持动态刷新
        refresh-enabled: true
        # 命名空间（可选，用于环境隔离）
        namespace: ${NACOS_NAMESPACE:}
        # 配置分组
        group: DEFAULT_GROUP
        # 配置文件扩展名
        file-extension: yaml
        # 文件编码
        encode: UTF-8
        # 配置超时时间（毫秒）
        timeout: 3000
        # 最大重试次数
        max-retry: 3
        # 重试间隔（毫秒）
        config-retry-time: 2000
        # 是否启用配置监听
        enable-remote-sync-config: true
        # 配置导入（Spring Boot 3 新方式）
        import-check:
          enabled: true

      # 服务发现配置（如果使用）
      discovery:
        # 是否启用服务发现
        enabled: true
        # 命名空间（可选，用于环境隔离）
        namespace: ${NACOS_NAMESPACE:}
        # 服务分组
        group: DEFAULT_GROUP

  # 配置导入（关键！Spring Boot 3 的新方式）
  config:
    import:
      # 导入 Nacos 配置
      - optional:nacos:${spring.application.name}.yaml
      # 导入环境特定的 Nacos 配置
      - optional:nacos:${spring.application.name}-${spring.profiles.active:default}.yaml
      # 导入共享配置
      - optional:nacos:common-config.yaml
      - optional:nacos:application.yaml?group=DEFAULT_GROUP&refreshable=true

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /api

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,configprops,env,refresh
  endpoint:
    health:
      show-details: always

# 日志配置
logging:
  level:
    root: INFO
    com.example: DEBUG
    com.alibaba.nacos: WARN

# 自定义业务配置（会被 Nacos 配置覆盖）
user:
  service:
    cache-expire-time: 3600
    max-registration-count: 10000
    enable-email-verification: true

