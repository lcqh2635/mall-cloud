# 服务器配置
server:
  port: 9999
  # servlet 配置
  servlet:
    # 请求基础路径，用于处理请求，默认为 /
    context-path: /code
  # gzip 压缩，用于减少响应体网络传输量，默认关闭。压缩会有一定的CPU性能损耗。
  compression:
    enabled: true
    # 执行压缩所需的最小 Content-Length 值，默认为 2048 字节即 2KB，小于该值的响应体将不压缩
    min-response-size: 10KB
  # HTTP/2 配置，用于支持 HTTP/2 协议
  http2:
    # 是否开启 HTTP/2 支持，默认关闭
    enabled: true

# 配置配置应用的常规、非敏感、不变动的属性
spring:
  # 应用名称
  application:
    name: code-generator
  # 默认激活开发环境，生产通过启动参数覆盖
  profiles:
    active: dev
  # 时间日期格式化配置
  Jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 开启虚拟线程功能
  threads:
    virtual:
      enabled: true
  # 虚拟线程的一个副作用是它们是守护线程。如果其所有线程都是守护线程，则 JVM 将退出。
  # 建议将属性spring.main.keep-alive设置为true。这确保了即使所有线程都是虚拟线程，JVM 也会保持活动状态。
  main:
    keep-alive: true

  # ============================================
  #             数据库基础配置
  # ============================================
  datasource:
    # 数据库驱动类名（PostgreSQL）
    driver-class-name: org.postgresql.Driver
    # JDBC 连接 URL，格式：jdbc:postgresql://主机:端口/数据库名?参数
    url: jdbc:postgresql://localhost:5432/your_database?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    # 数据库用户名
    username: postgres
    # 数据库密码
    password: your_password
    # ============================================
    #         HikariCP 连接池配置（默认）
    # ============================================
    hikari:
      # 连接池名称
      pool-name: MyHikariCP
      # 最小空闲连接数（建议与最大连接数保持一致或略小）
      minimum-idle: 5
      # 最大连接数（根据服务器配置调整，一般CPU核数*2+1）
      maximum-pool-size: 20
      # 连接超时时间（毫秒），默认30000（30秒）
      connection-timeout: 30000
      # 空闲连接超时时间（毫秒），默认600000（10分钟）
      idle-timeout: 600000
      # 连接最大生命周期（毫秒），默认1800000（30分钟）
      max-lifetime: 1800000
      # 连接测试查询（用于验证连接是否有效）
      connection-test-query: SELECT 1
      # 是否启用JMX监控
      register-mbeans: true
  # ============================================
  #           SQL初始化配置
  # ============================================
  sql:
    init:
      # 初始化模式：always（总是）、embedded（仅嵌入式）、never（从不）
      mode: always
      # 是否继续执行出错脚本（默认false）
      continue-on-error: false
      # 数据库平台（用于区分不同数据库的脚本）
      platform: postgresql
      # Schema脚本位置（创建表结构）
      schema-locations: classpath:db/postgres/schema.sql
      # 数据脚本位置（插入初始数据）
      data-locations: classpath:db/postgres/data.sql
      # Schema和Data文件的字符编码
      encoding: UTF-8


codegen:
  data-source-config:
    url: ${spring.datasource.url}
    username: ${spring.datasource.username}
    password: ${spring.datasource.password}
  package-config:
    base-package: "com.mallcloud"
  javadoc-config:
    author: "龙茶清欢"
    since: ${spring.Jackson.date-format}
  strategy-config:
    generate-schema: "mall-cloud"
    generate-tables: t_user, t_order
    table-prefix: t_
    logic-delete-column: is_deleted
    version-column: version