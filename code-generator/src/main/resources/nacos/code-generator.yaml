# 代码生成器配置
code-generator:
  # 开启生成器
  enabled: true
  # 数据库连接配置
  dataSource-config:
    url: ${spring.datasource.url}
    username: ${spring.datasource.username}
    password: ${spring.datasource.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    db-type: POSTGRESQL
    # 可选：仅 PostgreSQL/Oracle 使用
    # schema: public
    # catalog: mydb
  # 全局配置
  global-config:
    author: "龙茶清欢"                  # 生成文件的作者
    file-override: false               # 是否覆盖已有文件（生产环境务必为 false）
    enable-cache: false                # 是否启用 XML 缓存（一般不改）
    base-result-map: true              # 是否生成 BaseResultMap
    base-column-list: true             # 是否生成 BaseColumnList
    output-dir: "/project/backend/src/main/java"      # 输出目录（必须存在）
    open: false                        # 生成后是否自动打开文件夹
  # 包结构配置
  package-config:
    parent: "com.example"              # 父包名
    module-name: "user-service"        # 关键！生成到 user-service 模块
    entity: "model.entity"             # 实体类包
    controller: "controller"           # Controller 包
    service: "service"                 # Service 接口包
    service-impl: "service.impl"       # Service 实现包
    mapper: "mapper"                   # Mapper 接口包
    xml: "mapper"                      # XML 文件包（必须与 mapper 一致）
  # 生成策略配置
  strategy-config:
    include: # 只生成指定表（留空则生成全部）
      - "t_user"
      - "t_product"
    table-prefix: "t_"                 # 自动去除表前缀 t_，生成 User、Product
    # 实体类策略
    entity:
      enable-lombok: true
      enable-file-override: false
      disable-serial-version-uid: true
      enable-chain-model: false
      enable-remove-is-prefix: false
      enable-table-field-annotation: true
      enable-active-record: false
      version-column-name: "version"
      logic-delete-column-name: "is_deleted"
      super-class: "BaseEntity.class"
      add-super-entity-columns:
        - "id"
        - "created_by"
        - "created_time"
        - "updated_by"
        - "updated_time"
      add-ignore-columns:
        - "age"
      add-table-fills:
        - "create_time"
        - "update_time"
      id-type: "AUTO"
      format-file-name: "%s"
    controller:
      enable-file-override: true
      enable-rest-style: true
      format-file-name: "%sController"
    service:
      enable-file-override: true
      format-service-file-name: "%sService"
      format-service-impl-file-name: "%sServiceImpl"
    mapper:
      enable-file-override: true
      format-mapper-file-name: "%sMapper"
      format-xml-file-name: "%sMapper"
  # 自定义模板路径（覆盖默认模板）
  injection-config:
    # 自定义文件
    custom-files:
      dto:
        enable-file-override: true
        package-name: "model.dto"
      vo:
        enable-file-override: true
        package-name: "model.vo"
      application:
        enable-file-override: true
      api:
        enable-file-override: true