spring:
  main:
    banner-mode: off

mallcloud:
  banner:
    enabled: true
    application-name: "My Awesome App 666"
    version: "2.1.0"
    author: "Development Team"
    description: "This is a sample application using custom banner"
    show-info: true
    location: "classpath:banner/my-banner.txt"  # 可选，使用自定义banner文件