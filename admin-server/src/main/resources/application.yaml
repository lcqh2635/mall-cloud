# 服务器配置
server:
  port: 7777

# 配置配置应用的常规、非敏感、不变动的属性
spring:
  # 配置 admin 服务端地址和认证信息
  boot:
    admin:
      ui:
        title: Urbane Commerce 服务监控
      instance-auth:
        default-user-name: admin
        default-password: 479368
      notify:
        mail:
          enabled: false   # 按需开启邮件告警
  # Nacos 配置中心配置（基础连接信息）
  cloud:
    # 负载均衡配置
    loadbalancer:
      nacos:
        enabled: true
    nacos:
      # Nacos 服务器地址
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      # 用户名和密码（如果 Nacos 启用了认证）
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      # 服务发现配置（如果使用）
      discovery:
        # 命名空间（可选，用于环境隔离）
        namespace: ${NACOS_NAMESPACE:}
        # 服务分组
        group: DEFAULT_GROUP
      # 配置中心特定配置
      config:
        # 命名空间（可选，用于环境隔离）
        namespace: ${NACOS_NAMESPACE:}
        # 配置分组
        group: DEFAULT_GROUP
        # 配置文件扩展名
        file-extension: yaml
        # 配置中心文件配置是否支持动态刷新
        refresh-enabled: true
        # 是否启用配置监听
        enable-remote-sync-config: true
  # 配置导入（关键！Spring Boot 3 的新方式）
  config:
    import:
      # 导入 Nacos 配置
      - optional:nacos:${spring.application.name}.yaml
      # 导入环境特定的 Nacos 配置
      - optional:nacos:${spring.application.name}-${spring.profiles.active:default}.yaml
      # 导入共享配置
      - optional:nacos:common-config.yaml
      - optional:nacos:application.yaml?group=DEFAULT_GROUP&refreshable=true