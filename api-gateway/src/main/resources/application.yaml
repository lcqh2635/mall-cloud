# Spring Cloud Gateway 配置
# https://docs.springjava.cn/spring-cloud-gateway/reference/index.html
# https://docs.springjava.cn/spring-cloud-gateway/reference/appendix.html


# 服务器配置
server:
  port: 8888
  # servlet 配置
  servlet:
    # 请求基础路径，用于处理请求，默认为 /
    context-path: /api
  # gzip 压缩，用于减少响应体网络传输量，默认关闭。压缩会有一定的CPU性能损耗。
  compression:
    enabled: true
    # 执行压缩所需的最小 Content-Length 值，默认为 2048 字节即 2KB，小于该值的响应体将不压缩
    min-response-size: 10KB
  # HTTP/2 配置，用于支持 HTTP/2 协议
  http2:
    # 是否开启 HTTP/2 支持，默认关闭
    enabled: true

# 配置配置应用的常规、非敏感、不变动的属性
spring:
  # 应用名称
  application:
    name: api-gateway
  # 默认激活开发环境，生产通过启动参数覆盖
  profiles:
    active: dev
  # 时间日期格式化配置
  Jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 开启虚拟线程功能
  # https://docs.springjava.cn/spring-boot/appendix/application-properties/index.html#application-properties.core.spring.threads.virtual.enabled
  threads:
    virtual:
      enabled: true
  # 虚拟线程的一个副作用是它们是守护线程。如果其所有线程都是守护线程，则 JVM 将退出。
  # 建议将属性spring.main.keep-alive设置为true。这确保了即使所有线程都是虚拟线程，JVM 也会保持活动状态。
  main:
    keep-alive: true

  # Nacos 配置中心配置（基础连接信息）
  cloud:
    # 负载均衡配置
    loadbalancer:
      nacos:
        enabled: true
    # Spring Cloud Nacos 配置
    # Nacos 是阿里巴巴开源的一个更易于构建云原生应用的动态服务发现、配置管理和服务管理平台
    # https://github.com/alibaba/spring-cloud-alibaba/blob/2025.1.x/spring-cloud-alibaba-examples/nacos-example/readme-zh.md
    nacos:
      # Nacos 服务器地址
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      # 用户名和密码（如果 Nacos 启用了认证）
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      # 服务发现配置（如果使用）
      discovery:
        # 命名空间（可选，用于环境隔离）
        namespace: ${NACOS_NAMESPACE:}
        # 服务分组
        group: DEFAULT_GROUP
      # 配置中心特定配置
      config:
        # 命名空间（可选，用于环境隔离）
        namespace: ${NACOS_NAMESPACE:}
        # 配置分组
        group: DEFAULT_GROUP
        # 配置文件扩展名
        file-extension: yaml
        # 配置中心文件配置是否支持动态刷新
        refresh-enabled: true
        # 是否启用配置监听
        enable-remote-sync-config: true
  # 配置导入（关键！Spring Boot 3 的新方式）
  # https://docs.springjava.cn/spring-cloud-config/reference/client.html#config-data-import
  config:
    import:
      # 导入 Nacos 配置
      - optional:nacos:${spring.application.name}.yaml
      # 导入环境特定的 Nacos 配置
      - optional:nacos:${spring.application.name}-${spring.profiles.active:default}.yaml
      # 导入共享配置
      - optional:nacos:common-config.yaml
      - optional:nacos:application.yaml?group=DEFAULT_GROUP&refreshable=true


jwt:
  secret-key: ${JWT_SECRET:change-me-in-production}  # 生产环境务必通过环境变量设置！
  # 可选：Token 过期时间（用于生成时的参考）
  expiration: 7200  # 2 小时
  # 可选：刷新令牌有效期
  refresh-expiration: 604800  # 7 天




# 配置 actuator 对外指标
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  # 配置 Prometheus 监控
  Prometheus:
    metrics:
      export:
        enabled: true
  # 这个应用所有上报的 metrics 都会带上 application 这个标签的值，用于区分不同应用
  metrics:
    tags:
      application: ${spring.application.name}

# 然后可以通过访问 http://localhost:8081/actuator 获取应用指标信息
# 然后可以通过访问 http://localhost:8081/actuator/prometheus 获取Prometheus格式的指标数据