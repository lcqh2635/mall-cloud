# ==========================================================
# 基础网络定义文件
# 说明：定义所有中间件共享的内部通信网络，提供 DNS 解析与二层隔离
# ==========================================================

networks:
  infra-net:  # 自定义网络名称，供所有 compose 文件统一引用
    driver: bridge  # 使用 Docker 默认桥接模式，自动提供容器间服务发现
    ipam:  # IP 地址管理配置块
      config:  # 子网规划列表
        - subnet: 172.28.0.0/16  # 分配独立 CIDR 网段，避免与宿主机默认 Docker 网桥冲突
          gateway: 172.28.0.1  # 指定网络网关地址，便于抓包调试与路由分析