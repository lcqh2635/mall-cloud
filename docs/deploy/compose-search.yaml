# ==========================================================
# Docker Compose 配置文件
# 说明：现代 Docker Compose (V2) 已默认支持最新规范，无需显式声明 version 字段
# ==========================================================

services:

  # ---------------- Redis 缓存数据库服务 ----------------
  redis:
    # 使用官方 Redis 7 的 Alpine 精简镜像，稳定且轻量
    image: redis:7-alpine
    # 指定容器名称
    container_name: app-redis
    # 覆盖镜像默认启动命令，追加生产级安全与性能参数
    command:
      - redis-server
      - --requirepass  # 启用 Redis 密码认证
      - SecureRedis456!  # 设置 Redis 连接密码（生产环境务必更换）
      - --appendonly  # 开启 AOF 持久化模式
      - "yes"  # 启用 AOF，保证写入操作不丢失
      - --maxmemory  # 限制 Redis 最大内存使用量
      - 256mb  # 限制为 256MB，防止缓存击穿或内存泄漏拖垮宿主机
      - --maxmemory-policy  # 配置内存淘汰策略
      - allkeys-lru  # 内存满载时，优先淘汰最近最少使用的键
    # 端口映射配置
    ports:
      # 将宿主机的 6379 端口映射至容器内部
      - "6379:6379"
    # 数据卷挂载配置
    volumes:
      # 命名卷挂载至 Redis 默认工作目录，用于持久化 RDB 快照与 AOF 日志文件
      - redis_data:/data
    # 容器退出策略：除非手动停止，否则始终自动重启
    restart: unless-stopped
    # 健康检查配置
    healthcheck:
      # 携带密码发送 PING 命令，验证 Redis 是否正常响应
      test: ["CMD", "redis-cli", "-a", "SecureRedis456!", "ping"]
      # 每隔 10 秒检查一次
      interval: 10s
      # 检查超时时间
      timeout: 5s
      # 失败 3 次标记为不健康
      retries: 3
      # 预留 10 秒启动缓冲期
      start_period: 10s
    # 网络配置
    networks:
      # 与 PostgreSQL 处于同一自定义网络，应用可通过服务名直接访问
      - app-network

  # ---------------- PostgreSQL 数据库服务 ----------------
  postgres:
    # 使用官方 PostgreSQL 16 的 Alpine 精简镜像，体积小且安全更新快
    image: postgres:16-alpine
    # 指定容器名称，便于通过 docker ps 或日志命令快速定位
    container_name: app-postgres
    # 容器启动时注入的环境变量，用于初始化数据库
    environment:
      # 设置数据库默认超级管理员用户名（生产环境建议修改）
      POSTGRES_USER: app_user
      # 设置数据库管理员密码（务必使用强密码，生产环境建议结合 Docker Secrets）
      POSTGRES_PASSWORD: SecurePass123!
      # 容器首次启动时自动创建的空数据库，专门用于 Nacos 配置与注册数据持久化
      POSTGRES_DB: nacos_config
      # 设置容器时区，避免日志和查询时间出现偏差
      TZ: Asia/Shanghai
    # 端口映射配置（格式：宿主机端口:容器内部端口）
    # 将宿主机的 5432 端口映射至容器内部，允许外部客户端直连
    ports:
      - "5432:5432"
    # 数据卷挂载配置，实现数据与容器生命周期解耦
    volumes:
      # 命名卷挂载至 PostgreSQL 默认数据存储目录，防止容器重建导致数据丢失
      - postgres_data:/var/lib/postgresql/data
    # 容器退出策略：除非手动执行 docker stop，否则异常退出或宿主机重启时自动拉起
    restart: unless-stopped
    # 健康检查配置，用于编排系统判断服务是否真正就绪
    healthcheck:
      # 调用官方内置工具验证 PG 实例是否可接受连接
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_database"]
      # 每隔 10 秒执行一次健康检查
      interval: 10s
      # 单次检查命令的超时时间
      timeout: 5s
      # 连续 3 次检查失败后，Docker 会将该容器标记为 unhealthy
      retries: 3
      # 容器启动后预留 30 秒的缓冲期，避免初始化未完成时被误判为不健康
      start_period: 30s
    # 网络配置
    networks:
      # 将容器加入自定义网络，实现服务间安全通信
      - app-network

  # ---------------- Nacos 服务注册与配置中心（对接 PostgreSQL） ----------------
  nacos:
    # 使用 Nacos 2.3.0 官方镜像，原生支持 PG 数据源与 gRPC 长连接
    image: nacos/nacos-server:v2.3.0
    # 指定容器名称
    container_name: alibaba-nacos
    # 核心运行时环境变量
    environment:
      # 运行模式设为单机版，适用于开发测试环境（生产集群需改为 cluster）
      MODE: standalone
      # 强制指定数据源平台为 PostgreSQL，覆盖默认的内嵌 Derby 数据库
      SPRING_DATASOURCE_PLATFORM: pg
      # 指定 PG 服务地址，利用 Docker 内部 DNS 自动解析容器名
      PGSQL_SERVICE_HOST: infra-postgres
      # 指定 PG 服务监听端口
      PGSQL_SERVICE_PORT: 5432
      # 指定 Nacos 连接的目标数据库名称，需与 postgres 服务 POSTGRES_DB 保持一致
      PGSQL_SERVICE_DB_NAME: nacos_config
      # 指定 Nacos 连接 PG 的认证用户名
      PGSQL_SERVICE_USER: nacos_admin
      # 指定 Nacos 连接 PG 的认证密码
      PGSQL_SERVICE_PASSWORD: NacosPgPass2026!
      # 限制 JVM 初始堆内存，防止小规格宿主机启动 OOM
      JVM_XMS: 256m
      # 限制 JVM 最大堆内存，控制整体资源水位
      JVM_XMX: 512m
      # 开启控制台与 OpenAPI 鉴权，拦截未授权操作
      NACOS_AUTH_ENABLE: "true"
      # 设置鉴权加密盐值，生产环境必须更换为随机强字符串
      NACOS_AUTH_TOKEN: SecretToken2026!
    # 端口映射配置
    ports:
      - "8848:8848"  # 暴露 HTTP 控制台端口，用于 Web 界面访问与 RESTful API 调用
      - "9848:9848"  # 暴露 gRPC 客户端通信端口，微服务实例注册与配置拉取核心通道
      - "9849:9849"  # 暴露 gRPC 服务端同步端口，集群模式下节点间数据复制通道
    # 数据与日志持久化
    volumes:
      - nacos_data:/home/nacos/data  # 命名卷挂载至数据目录，保留本地配置快照、操作日志与运行缓存
    # 服务依赖与启动顺序控制
    depends_on:
      postgres:  # 依赖声明对象
        condition: service_healthy  # 严格等待 PostgreSQL 健康检查通过后，再拉起 Nacos 容器
    # 容器退出策略
    restart: unless-stopped
    # 健康检查配置
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8848/nacos/ || exit 1"]  # 通过 HTTP GET 验证控制台首页是否可达
      interval: 15s  # 检查间隔时间
      timeout: 10s  # 检查超时阈值
      retries: 3  # 连续失败标记 unhealthy 的次数
      start_period: 45s  # 预留充足缓冲期，适应 JVM 预热、PG 连接池初始化与元数据加载
    networks:  # 网络归属声明
      - infra-net  # 加入同一内部网络，实现与 PG 及其他中间件的零延迟互通

  # ---------------- RocketMQ NameServer 路由发现节点 ----------------
  rocketmq-namesrv:
    image: apache/rocketmq:5.1.4  # 使用 RocketMQ 5.1.4 官方标准镜像，兼容云原生架构
    container_name: rocketmq-namesrv  # 指定容器名称
    command: sh mqnamesrv  # 覆盖默认启动命令，仅运行轻量级 NameServer 路由服务
    environment:  # 环境变量配置
      JAVA_OPT_EXT: "-server -Xms128m -Xmx256m"  # 限制 NameServer JVM 内存，避免路由服务过度消耗宿主机资源
    ports:  # 端口映射配置
      - "9876:9876"  # 暴露 NameServer 监听端口，供 Broker 注册路由信息与客户端发现元数据
    volumes:  # 日志持久化
      - namesrv_logs:/home/rocketmq/logs  # 命名卷挂载日志目录，便于排查路由注册异常与网络抖动
    restart: unless-stopped  # 容器退出策略
    healthcheck:  # 健康检查配置
      test: ["CMD-SHELL", "nc -z localhost 9876 || exit 1"]  # 使用 netcat 探测 TCP 端口是否处于监听状态
      interval: 10s  # 检查间隔
      timeout: 5s  # 检查超时
      retries: 3  # 重试次数
      start_period: 15s  # 启动缓冲期
    networks:  # 网络归属声明
      - infra-net  # 加入内部网络

  # ---------------- RocketMQ Broker 消息存储与代理节点 ----------------
  rocketmq-broker:
    image: apache/rocketmq:5.1.4  # 使用与 NameServer 严格一致的镜像版本，保障协议兼容
    container_name: rocketmq-broker  # 指定容器名称
    command: >  # 多行启动命令覆盖，显式指定 NameServer 地址、配置文件并开启 5.x Proxy 网关
      sh mqbroker -n rocketmq-namesrv:9876
      -c /home/rocketmq/rocketmq-5.1.4/conf/broker.conf
      --enable-proxy
    environment:  # 环境变量配置
      JAVA_OPT_EXT: "-server -Xms256m -Xmx512m"  # 限制 Broker JVM 内存，高吞吐场景需按实际压测调整
    ports:  # 端口映射配置
      - "10909:10909"  # 暴露 VIP 高速通道端口，用于高性能客户端直连通信
      - "10911:10911"  # 暴露常规请求端口，生产者/消费者默认连接与消息收发主通道
      - "10912:10912"  # 暴露 HA 主从同步端口，集群模式下 CommitLog 异步复制通道
      - "8081:8081"  # 暴露 Proxy HTTP/gRPC 端口，用于 5.x 新协议客户端平滑接入
    depends_on:  # 服务依赖控制
      rocketmq-namesrv:  # 依赖对象
        condition: service_healthy  # 严格等待 NameServer 就绪后再启动 Broker，避免路由注册失败
    volumes:  # 数据与日志持久化
      - broker_logs:/home/rocketmq/logs  # 命名卷挂载运行日志，保留事务轨迹、堆积报警与消费偏移量日志
      - broker_store:/home/rocketmq/store  # 命名卷挂载消息物理存储目录，防止容器重建导致消息丢失
    restart: unless-stopped  # 容器退出策略
    healthcheck:  # 健康检查配置
      test: ["CMD-SHELL", "nc -z localhost 10911 || exit 1"]  # 探测 Broker 主通信端口连通性
      interval: 15s  # 检查间隔
      timeout: 5s  # 检查超时
      retries: 3  # 重试次数
      start_period: 35s  # 预留缓冲期，适应 CommitLog 加载、内存映射初始化与索引重建
    networks:  # 网络归属声明
      - infra-net  # 加入内部网络

  # ---------------- Sentinel 流量控制与熔断降级仪表盘 ----------------
  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.7  # 使用社区长期维护的稳定版控制台镜像（官方已停止 Docker Hub 推送）
    container_name: alibaba-sentinel  # 指定容器名称
    environment:  # 环境变量配置
      JAVA_OPTS: >  # 传递 JVM 参数至容器内部，固定服务端口与项目标识
        -Dserver.port=8080
        -Dcsp.sentinel.dashboard.server=localhost:8080
        -Dproject.name=sentinel-dashboard
    ports:  # 端口映射配置
      - "8080:8080"  # 暴露 Sentinel 控制台 Web 端口，默认登录账号与密码均为 sentinel
    restart: unless-stopped  # 容器退出策略
    healthcheck:  # 健康检查配置
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]  # 验证 Web 控制台首页是否返回 HTTP 200
      interval: 15s  # 检查间隔
      timeout: 5s  # 检查超时
      retries: 3  # 重试次数
      start_period: 25s  # 启动缓冲期
    networks:  # 网络归属声明
      - infra-net  # 加入内部网络，微服务应用可通过内部 DNS 推送限流规则与实时指标

  # ---------------- Seata 分布式事务协调器 ----------------
  seata-server:
    image: seataio/seata-server:1.7.1  # 使用 Seata 1.7.1 官方镜像，全面支持 AT/TCC/SAGA/XA 模式
    container_name: alibaba-seata  # 指定容器名称
    environment:  # 环境变量配置
      SEATA_PORT: 8091  # 设置 Seata Server 监听端口，微服务客户端通过此端口获取全局锁与分支状态
      STORE_MODE: file  # 设置事务日志存储模式为本地文件（单机开发推荐，生产建议改为 db 或 redis）
      CONFIG_TYPE: file  # 设置配置加载模式为本地文件（单机开发推荐，生产建议接入 Nacos 集中管理）
      REGISTRY_TYPE: file  # 设置注册中心模式为本地文件（若需注册到 Nacos 供业务自动发现，请改为 nacos）
    ports:  # 端口映射配置
      - "8091:8091"  # 暴露 Seata RPC 通信端口，处理全局事务提交/回滚请求与心跳保活
    volumes:  # 配置与数据持久化
      - seata_data:/root/seata-server  # 命名卷挂载 Seata 工作目录，保留事务快照、undo_log 与本地配置文件
    restart: unless-stopped  # 容器退出策略
    healthcheck:  # 健康检查配置
      test: ["CMD-SHELL", "nc -z localhost 8091 || exit 1"]  # 探测 Seata Server RPC 端口是否处于监听状态
      interval: 15s  # 检查间隔
      timeout: 5s  # 检查超时
      retries: 3  # 重试次数
      start_period: 30s  # 启动缓冲期，适应事务日志回放与集群元数据加载
    networks:  # 网络归属声明
      - infra-net  # 加入内部网络

# ==========================================================
# 命名卷定义（Docker 自动管理宿主机底层存储路径与权限隔离）
# ==========================================================
volumes:
  postgres_data:  # PostgreSQL 数据持久化卷
    driver: local  # 使用 Docker 默认本地存储驱动
  nacos_data:  # Nacos 数据持久化卷
    driver: local  # 使用本地存储驱动
  namesrv_logs:  # RocketMQ NameServer 日志卷
    driver: local  # 使用本地存储驱动
  broker_logs:  # RocketMQ Broker 运行日志卷
    driver: local  # 使用本地存储驱动
  broker_store:  # RocketMQ Broker 消息物理存储卷
    driver: local  # 使用本地存储驱动（生产环境强烈建议替换为高性能 SSD 或分布式存储）
  seata_data:  # Seata 事务协调数据卷
    driver: local  # 使用本地存储驱动

# ==========================================================
# 自定义网络定义（实现中间件间安全隔离与内部 DNS 自动解析）
# ==========================================================
networks:
  infra-net:  # 自定义网络名称
    driver: bridge  # 使用桥接模式，默认提供内部 DNS 服务，容器间可通过服务名直接互访
    ipam:  # IP 地址管理配置
      config:  # 子网规划配置
        - subnet: 172.28.0.0/16  # 分配独立子网段，避免与宿主机默认 Docker 网桥冲突


# Nacos 官方镜像在对接外部数据库时不会自动建表。您需要在 PostgreSQL 容器启动后，手动执行 Nacos 提供的 PostgreSQL 初始化脚本：
# 1. 下载官方 PG 初始化脚本（需自行从 Nacos GitHub release 或社区获取 nacos-pg.sql）
# 2. 进入 PG 容器执行导入
# podman exec -i infra-postgres psql -U nacos_admin -d nacos_config < nacos-pg.sql

# 查看状态与日志
# 查看容器运行状态及健康检查结果
# podman compose ps
# 实时查看两个数据库的合并日志
# podman compose logs -f
# 仅查看 PostgreSQL 日志
# podman compose logs -f postgres

# 连接测试
# 连接 PostgreSQL
# podman exec -it app-postgres psql -U app_user -d app_database
# 连接 Redis
# podman exec -it app-redis redis-cli -a SecureRedis456!